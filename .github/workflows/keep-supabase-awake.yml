name: Keep Supabase awake

# Supabase pauses a free project after a week without activity, which takes the library and
# public songs offline until it's restored by hand. A small read twice a week counts as activity.
on:
  schedule:
    # Mondays and Thursdays, 12:00 UTC.
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The same public project address and publishable key as src/lib/supabaseClient.ts. Reads
      # one row of the public songs, which anyone may read, so it reaches the database itself.
      - name: Read from the database
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: sb_publishable_eLjlNjZWTUZ_qiUMUIeYvw_HcJJH-OC" \
            "https://bpsrqjjetfzadyahtpnj.supabase.co/rest/v1/public_songs?select=id&limit=1"

      # GitHub turns off scheduled workflows in a public repository after 60 days without a
      # commit. Re-enabling this one each run keeps it on through quiet months.
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-supabase-awake.yml/enable"
